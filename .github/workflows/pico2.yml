name: RP2350 Pico 2 UF2

on:
  push:
    branches:
      - hw/rp2350-pico2
    paths:
      - 'rp2350-pico2/**'
      - '.github/workflows/pico2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pico SDK 2.3.1
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build cmake python3
      - name: Configure for RP2350 Pico 2
        run: cmake -S rp2350-pico2 -B build-pico2 -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DPICO_BOARD=pico2
      - name: Build UF2
        run: cmake --build build-pico2 --parallel 2
      - name: Upload UF2 and ELF
        uses: actions/upload-artifact@v4
        with:
          name: bluetoothModule-RP2350-Pico2-UF2
          path: |
            build-pico2/bluetooth_module_pico2.uf2
            build-pico2/bluetooth_module_pico2.elf
            build-pico2/bluetooth_module_pico2.bin
          if-no-files-found: error

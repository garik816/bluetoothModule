name: ESP32-S3 firmware and KCX parser

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'main/**'
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify KCX v1.7 UART response parser
        run: sh tests/run.sh

  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF 5.5 ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: '.'
      - name: Upload flash files
        uses: actions/upload-artifact@v4
        with:
          name: bluetoothModule-esp32s3-build
          path: |
            build/bluetooth_module.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: warn
